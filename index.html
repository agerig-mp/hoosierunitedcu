<!doctype html>

  <script>
    if (new URLSearchParams(window.location.search).get("sn") === "true") {
      document.documentElement.classList.add("sn-hide-notice");

  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<body class="bg-body">
  <a class="skip-link" href="#main">Skip to main content</a>

    <div data-include="modules/topbar.html"></div>

    <div data-include="modules/hero.html"></div>

    <div data-include="modules/cta.html"></div>
  </main>

  <div data-include="modules/footer.html"></div>

  <script>
    (function loadModules() {
      const slots = Array.from(document.querySelectorAll("[data-include]"));
      if (!slots.length) {
        document.documentElement.classList.add("modules-ready");
        return;
      }

      Promise.all(
        slots.map(async function (slot) {
          const path = slot.getAttribute("data-include");
          const response = await fetch(path, { cache: "no-store" });
          if (!response.ok) {
            throw new Error("Failed to load module: " + path);
          }
          slot.outerHTML = await response.text();
        })
      )
        .then(function () {
          document.documentElement.classList.add("modules-ready");
        })
        .catch(function (error) {
          console.error(error);
        });
    })();
  </script>
  <script>
    window.gtranslateSettings = {
      default_language: "en",
      languages: ["en", "es"],
      wrapper_selector: ".gtranslate_wrapper"
    };
  </script>
  <script>
    (function initTranslateWidget() {
      const labels = {
        en: "EN",
        es: "SP"
      };
      let widgetLoaded = false;

      function syncLabels() {
        document.querySelectorAll(".gtranslate_wrapper a[data-gt-lang]").forEach(function (link) {
          const language = link.getAttribute("data-gt-lang");
          if (labels[language]) {
            link.textContent = labels[language];
          }
        });
      }

      function loadWidget() {
        if (widgetLoaded || !document.querySelector(".gtranslate_wrapper")) {
          return false;
        }

        widgetLoaded = true;

        const script = document.createElement("script");
        script.src = "https://cdn.gtranslate.net/widgets/latest/lc.js";
        script.defer = true;
        script.addEventListener("load", syncLabels);
        document.body.appendChild(script);

        return true;
      }

      const observer = new MutationObserver(function () {
        syncLabels();
        if (loadWidget()) {
          observer.disconnect();
        }
      });

      observer.observe(document.documentElement, { childList: true, subtree: true });

      document.addEventListener("DOMContentLoaded", function () {
        syncLabels();
        if (loadWidget()) {
          observer.disconnect();
        }
      });
    })();
  </script>
  <script>
    (function enablePromoRail() {
      const rails = document.querySelectorAll("[data-promo-rail]");
      rails.forEach((rail) => {
        const track = rail.querySelector(".promo-card-grid");
        const prev = rail.querySelector("[data-promo-prev]");
        const next = rail.querySelector("[data-promo-next]");
        if (!track || !prev || !next) {
          return;
        }

        function getStep() {
          const firstCard = track.querySelector(".promo-card");
          if (!firstCard) {
            return track.clientWidth;
          }
          const gap = Number.parseFloat(window.getComputedStyle(track).columnGap || window.getComputedStyle(track).gap || "0");
          return firstCard.getBoundingClientRect().width + gap;
        }

        prev.addEventListener("click", function () {
          track.scrollBy({ left: -getStep(), behavior: "smooth" });
        });

        next.addEventListener("click", function () {
          track.scrollBy({ left: getStep(), behavior: "smooth" });
        });
      });
    })();
  </script>
  <script>
    (function enableHotReload() {
      const targets = [
        window.location.pathname || "/",
        "assets/css/styles.css"
      ];
      const seen = new Map();

      async function getContents(url) {
        try {
          const separator = url.includes("?") ? "&" : "?";
          const response = await fetch(`${url}${separator}hotreload=${Date.now()}`, {
            cache: "no-store"
          });
          if (!response.ok) {
            return null;
          }
          return await response.text();
        } catch (error) {
          return null;
        }
      }

      async function checkForChanges() {
        for (const url of targets) {
          const contents = await getContents(url);
          if (contents === null) {
            continue;
          }
          if (!seen.has(url)) {
            seen.set(url, contents);
            continue;
          }
          if (seen.get(url) !== contents) {
            window.location.reload();
            return;
          }
        }
      }

      window.setInterval(checkForChanges, 1000);
      checkForChanges();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
